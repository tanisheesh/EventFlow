services:
  - type: web
    name: EventFlow
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///eventhub.db
      - key: PORT
        value: "5000"
      # Reqly — API observability. If the collector is unreachable, EventFlow
      # still works normally (the SDK is fail-open). The release is read from
      # RENDER_GIT_COMMIT, so every alert names the deploy that was running.
      - key: REQLY_COLLECTOR_URL
        value: "https://reqly-eventflow-collector.onrender.com"
      - key: REQLY_API_KEY
        sync: false  # the collector's REQLY_INGEST_KEY, set in the Render dashboard
      - key: REQLY_ENVIRONMENT
        value: production
      - key: REQLY_CONSUMER_SALT
        generateValue: true
      - key: REQLY_DASHBOARD_URL
        value: "https://reqly-eventflow-dashboard.onrender.com"
